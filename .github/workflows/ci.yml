# CI workflow for inversion
# Generated by dskit (https://github.com/cacelass/dskit)

name: CI

on:
  push:
    branches: [main, master, desarrollo]
  pull_request:
    branches: [main, master, desarrollo]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      # El codigo de inversion/ usa modulos de varios extras (api, optuna,
      # monitoring, rag...): mypy y ruff los recorren enteros, asi que CI
      # instala todos los extras, no solo el principal.
      - name: Install dependencies
        run: |
          uv sync --all-extras --frozen

      - name: Lint
        run: uv run ruff check inversion/ tests/

      # Sin `--strict` en la linea: la configuracion vive en pyproject.toml
      # (strict global + relajado para tests/). Pasarlo aqui hacia que CI y tu
      # maquina comprobasen cosas distintas.
      - name: Type check
        run: uv run mypy inversion/ tests/

      # 60 y no 20. Medido sobre proyectos recien generados: supervisado da 74%
      # y no_supervisado 67%, asi que el umbral anterior no era una puerta, era
      # un adorno — cabia borrar dos tercios de los tests sin que CI se
      # inmutase. 60 deja margen a las combinaciones mas flacas sin dejar de
      # ser exigible.
      - name: Test with coverage
        run: uv run pytest tests/ -v --cov=inversion --cov-report=xml --cov-fail-under=60

      # Bloqueante a proposito: el arnes exige evidencia para cerrar una
      # feature, pero sus propios tests podian romperse sin que CI se enterase.
      - name: Agent tests
        run: uv run pytest agents/tests/ -v --tb=short

      # La puerta del arnés, en CI. Sin --quick no aportaría nada: los tests
      # ya se ejecutaron arriba y el fallo saldría dos veces.
      - name: Harness gate
        run: |
          chmod +x init.sh
          ./init.sh --quick

      # Los prompts de los agentes se derivan del código y de contracts.py.
      # Si alguien añade una acción y no regenera, esto lo caza.
      - name: Prompts in sync
        run: uv run python -m agents.prompts_sync

      # Solo las suites deterministas. `smoke` ejecuta la accion principal de
      # cada agente y depende del estado del proyecto (datos en data/raw/, un
      # modelo entrenado, un repo git): en uno recien generado falla por
      # motivos legitimos, asi que ahi no mide nada.
      - name: Agent evals
        run: uv run python -m agents.evals.runner --harness --routing --contracts

      - name: Security scan
        run: uv run bandit -r inversion/ -f txt -x tests || true
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: false